name: Temporary one-time formatting
on:
  push:
    branches:
      - feat/structured-website-generator
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/structured-website-generator
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write e2e/studio.spec.ts src/ui/GeneratorStudio.tsx tests/request-body.test.ts
      - name: Commit formatting to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/studio.spec.ts src/ui/GeneratorStudio.tsx tests/request-body.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format reviewed code and regression tests"
            git push origin HEAD:feat/structured-website-generator
          fi
