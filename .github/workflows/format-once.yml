name: Format once on feature branch

on:
  push:
    branches:
      - feat/structured-website-generator

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm run format
      - name: Commit formatted code and dependency lockfile
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: apply Prettier and lock dependencies"
            git push origin HEAD:feat/structured-website-generator
          fi
